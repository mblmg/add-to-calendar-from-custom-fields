name: Release

# Publishing a release with a tag like 2.0.1 (or pushing such a tag):
# - attaches event-toolkit-for-custom-fields.zip to the release,
# - deploys the plugin to the WordPress.org directory, once enabled with the
#   repository variable WPORG_DEPLOY = true and the secrets SVN_USERNAME / SVN_PASSWORD.

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SLUG: event-toolkit-for-custom-fields
    steps:
      - uses: actions/checkout@v5

      - name: Check version numbers match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -Eq "^ \* Version:\s+${TAG}$" "${SLUG}.php" || { echo "Plugin header version does not match ${TAG}"; exit 1; }
          grep -q "define('IMM_TK_VERSION', '${TAG}');" "${SLUG}.php" || { echo "IMM_TK_VERSION does not match ${TAG}"; exit 1; }
          grep -Eq "^Stable tag: ${TAG}$" readme.txt || { echo "Stable tag does not match ${TAG}"; exit 1; }

      - name: Build zip
        run: |
          .github/build.sh
          (cd build && zip -qr "../${SLUG}.zip" "${SLUG}")

      - name: Attach zip to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SLUG }}.zip

      - name: Deploy to WordPress.org
        if: ${{ vars.WPORG_DEPLOY == 'true' }}
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ env.SLUG }}
          BUILD_DIR: build/${{ env.SLUG }}
