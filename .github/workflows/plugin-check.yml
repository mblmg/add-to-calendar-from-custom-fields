name: Plugin Check

# Runs the official WordPress.org Plugin Check on every push and pull request.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build plugin folder
        run: .github/build.sh

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build/event-toolkit-for-custom-fields
